# Replace measured geometry fields before any powered floor detour.
# Keep enable_full_detour:false until the basic fail-closed bench check passes.
collision_avoidance_node:
  ros__parameters:

    # Obstacle detection
    safe_distance: 0.45
    slow_distance: 0.75
    avoid_trigger_distance: 0.65

    # Movement speeds
    clear_speed_limit: 0.07
    slow_speed_limit: 0.05
    detour_speed_limit: 0.05

    # Turning
    max_turn_rate: 0.18
    heading_gain: 0.75
    heading_turn_threshold_deg: 20.0

    # Shorter detour
    goal_forward_distance: 1.10
    completion_radius: 0.12
    resume_distance: 0.10
    detour_timeout_sec: 240.0

    # Local planning
    path_lookahead: 0.25
    grid_resolution: 0.08
    grid_forward: 1.80
    grid_rear: 1.00
    grid_half_width: 1.80

    # Retain the cart's true dimensions.
    # Replace these example values with actual measurements.
    cart_front_extent: 0.19
    cart_rear_extent: 0.19
    cart_half_width: 0.135

    # Reduced EXTRA clearance, not reduced cart dimensions.
    safety_margin: 0.0

    # Set true only after stationary safety checks pass
    enable_full_detour: true


    # PLACEHOLDERS. x/y are relative to actual wheel-axis rotation center,
    # with +x forward, +y left; lidar_yaw_deg is facing relative to +x.
    lidar_x: 0.0
    lidar_y: 0.0
    lidar_yaw_deg: 0.0
    cart_front_extent: 0.19
    cart_rear_extent: 0.19
    cart_half_width: 0.135


    # Old keys accepted for YAML compatibility (not used by this version).
    base_speed: 0.4
    turn_speed: 0.8
    side_clearance_threshold: 0.70
    enable_initial_turn: false
    enable_bypass_segment: false
